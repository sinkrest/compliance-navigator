[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-navigator"
version = "0.1.0"
description = "Open-source compliance navigator for hardware builders"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Forkable Factory", email = "hello@forkablefactory.com"},
]
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
compliance-nav = "compliance_nav.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
