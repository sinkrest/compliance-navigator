# Standard Applicability Map
# Maps product categories to applicable EU directives, EN standards,
# US regulations, common pitfalls, and typical test costs.
#
# Source: Cross-referenced from directive scopes and CPSC recall patterns.
# Licence: MIT (this is curated data, not copyrighted regulation text).

categories:

  consumer_electronics:
    description: "General consumer electronic devices (non-wireless)"
    eu_directives: ["2014/35/EU", "2014/30/EU", "2011/65/EU", "2012/19/EU", "EC 1907/2006", "94/62/EC"]
    en_standards:
      - "EN 62368-1 (Safety)"
      - "EN 55032 (EMC emissions)"
      - "EN 55035 (EMC immunity)"
      - "EN 61000-3-2 (Harmonics)"
      - "EN 61000-3-3 (Flicker)"
    us_regulations:
      - "FCC Part 15 (unintentional radiator)"
      - "UL 62368-1 (safety – voluntary but often required by retailers)"
    common_pitfalls:
      - "EMC failures on conducted emissions – add filtering early"
      - "LVD requires testing to the specific product standard, not just 62368-1"
      - "WEEE registration required per country – often missed for first-time exporters"
    typical_test_costs:
      eu: "€3,000–8,000 (LVD + EMC + RoHS)"
      us: "€2,000–5,000 (FCC + UL)"

  usb_powered_device:
    description: "Devices powered via USB (5V–20V PD)"
    eu_directives: ["2014/30/EU", "2011/65/EU", "2012/19/EU", "EC 1907/2006", "94/62/EC"]
    note: "LVD (2014/35/EU) typically does NOT apply – USB PD max 20V DC is below the 75V DC threshold. However, EMC still applies."
    en_standards:
      - "EN 62368-1 (Safety – may apply depending on product function)"
      - "EN 55032 (EMC emissions)"
      - "EN 55035 (EMC immunity)"
      - "IEC 62680 (USB Type-C and PD specifications)"
    us_regulations:
      - "FCC Part 15 (unintentional radiator)"
    common_pitfalls:
      - "USB PD negotiation failures can cause overcurrent – test all PD profiles"
      - "Even though LVD may not apply, safety testing is still expected by retailers"
      - "CE marking still required (EMC + RoHS)"
    typical_test_costs:
      eu: "€2,000–5,000 (EMC + RoHS)"
      us: "€1,500–3,000 (FCC)"

  battery_powered_device:
    description: "Devices with integrated or removable batteries"
    eu_directives: ["2014/30/EU", "2011/65/EU", "2012/19/EU", "EC 1907/2006", "2023/1542", "94/62/EC"]
    en_standards:
      - "EN 62133-2 (Safety of lithium batteries)"
      - "EN 62368-1 (Product safety)"
      - "EN 55032/55035 (EMC)"
      - "UN 38.3 (Transport testing – required for shipping)"
      - "IEC 62281 (Safe transport of lithium batteries)"
    us_regulations:
      - "FCC Part 15"
      - "UL 2054 or UL 62133 (battery safety)"
      - "DOT/IATA regulations for shipping lithium batteries"
    common_pitfalls:
      - "UN 38.3 transport testing is mandatory – cannot ship lithium batteries without it"
      - "Battery Regulation 2023/1542 requires removable batteries from 2027"
      - "Thermal runaway risk – include protection circuits (BMS)"
      - "WEEE + battery take-back obligations are separate registrations"
    typical_test_costs:
      eu: "€5,000–12,000 (battery safety + EMC + RoHS + transport)"
      us: "€3,000–8,000 (UL battery + FCC)"

  iot_device:
    description: "Connected devices with WiFi, BLE, or cellular"
    eu_directives: ["2014/53/EU", "2011/65/EU", "2012/19/EU", "EC 1907/2006", "94/62/EC"]
    note: "RED (2014/53/EU) replaces both LVD and EMC for radio equipment – single directive covers safety, EMC, and spectrum."
    en_standards:
      - "EN 300 328 (2.4 GHz – WiFi/BLE)"
      - "EN 301 489-1 (EMC for radio equipment)"
      - "EN 301 489-17 (EMC for wideband data)"
      - "EN 62368-1 (Safety)"
      - "ETSI EN 303 645 (Cybersecurity for IoT – becoming mandatory)"
    us_regulations:
      - "FCC Part 15 (intentional radiator – requires FCC ID)"
      - "FCC Part 15 Subpart C or E depending on technology"
    common_pitfalls:
      - "RED requires Notified Body if no harmonised standard covers your radio tech"
      - "FCC intentional radiator requires FCC ID (not just supplier DoC)"
      - "Cybersecurity requirements (ETSI EN 303 645) becoming mandatory in EU from 2025"
      - "OTA updates must not break compliance"
    typical_test_costs:
      eu: "€5,000–15,000 (RED + RoHS + cybersecurity)"
      us: "€5,000–12,000 (FCC ID + safety)"

  wireless_device:
    description: "Devices with radio transmitters (WiFi, BLE, cellular, LoRa, Zigbee, NFC)"
    eu_directives: ["2014/53/EU", "2011/65/EU", "2012/19/EU", "EC 1907/2006", "94/62/EC"]
    en_standards:
      - "EN 300 328 (2.4 GHz)"
      - "EN 301 893 (5 GHz RLAN)"
      - "EN 300 220 (sub-GHz – LoRa, Sigfox)"
      - "EN 301 489-1 (EMC general)"
      - "EN 62368-1 (Safety)"
    us_regulations:
      - "FCC Part 15 (intentional radiator – FCC ID required)"
    common_pitfalls:
      - "Each radio technology may need separate testing"
      - "Antenna design affects compliance – changes require re-testing"
      - "Module exemption possible if using pre-certified radio module"
    typical_test_costs:
      eu: "€5,000–15,000"
      us: "€5,000–12,000"

  kitchen_appliance:
    description: "Electrical kitchen and food preparation appliances"
    eu_directives: ["2014/35/EU", "2014/30/EU", "2011/65/EU", "2012/19/EU", "EC 1907/2006", "EC 1935/2004", "94/62/EC"]
    en_standards:
      - "EN 60335-1 (Household appliances – general safety)"
      - "EN 60335-2-* (Part 2 specific to appliance type)"
      - "EN 55014-1 (EMC emissions – household)"
      - "EN 55014-2 (EMC immunity – household)"
    us_regulations:
      - "FCC Part 15"
      - "UL 60335-1 (safety)"
      - "FDA (if food contact)"
    common_pitfalls:
      - "Food contact materials must comply with EC 1935/2004 – migration testing required"
      - "Part 2 of EN 60335 is product-specific – you must find the right one"
      - "Thermal fuse and safety cutout requirements are strict"
    typical_test_costs:
      eu: "€4,000–10,000 (LVD + EMC + food contact)"
      us: "€3,000–8,000 (UL + FCC + FDA)"

  heating_device:
    description: "Electric heating products (heaters, heated garments, mug warmers)"
    eu_directives: ["2014/35/EU", "2014/30/EU", "2011/65/EU", "2012/19/EU", "EC 1907/2006", "94/62/EC"]
    en_standards:
      - "EN 60335-1 (General safety)"
      - "EN 60335-2-30 (Room heaters)"
      - "EN 60335-2-15 (Appliances for heating liquids)"
      - "EN 60335-2-17 (Blankets, pads, heated clothing)"
      - "EN 55014-1/2 (EMC)"
    us_regulations:
      - "FCC Part 15"
      - "UL 60335-2-* (specific to heater type)"
    common_pitfalls:
      - "Fire risk is #1 recall reason for heating products – thermal fuse mandatory"
      - "Overheat protection must be independent of main control"
      - "Surface temperature limits (EN 60335-1 Clause 11)"
      - "25%+ of CPSC heating device recalls cite fire/burn hazard"
    typical_test_costs:
      eu: "€4,000–8,000 (LVD + EMC + thermal testing)"
      us: "€3,000–7,000 (UL + FCC)"

  food_contact_product:
    description: "Products that contact food (utensils, containers, packaging)"
    eu_directives: ["EC 1935/2004", "94/62/EC"]
    note: "If also electrical, add LVD + EMC + RoHS + WEEE directives."
    en_standards:
      - "EN 1186 series (Overall migration)"
      - "EN 13130 series (Specific migration)"
      - "EU 10/2011 (Plastics – positive list)"
    us_regulations:
      - "FDA 21 CFR 174-186 (food contact substances)"
    common_pitfalls:
      - "Migration testing conditions depend on food type and temperature"
      - "Silicone, stainless steel, and ceramics each have specific test protocols"
      - "Printing inks and adhesives on food packaging also require compliance"
    typical_test_costs:
      eu: "€1,000–4,000 (migration testing per material)"
      us: "€1,000–3,000 (FDA compliance)"

  lighting:
    description: "LED lights, lamps, luminaires, and lighting fixtures"
    eu_directives: ["2014/35/EU", "2014/30/EU", "2011/65/EU", "2012/19/EU", "EC 1907/2006", "94/62/EC"]
    en_standards:
      - "EN 60598-1 (Luminaires – general safety)"
      - "EN 62031 (LED modules for general lighting)"
      - "EN 62471 (Photobiological safety – blue light hazard)"
      - "EN 55015 (EMC for lighting)"
      - "EN 61547 (EMC immunity for lighting)"
    us_regulations:
      - "FCC Part 15"
      - "UL 8750 (LED equipment)"
      - "Energy Star (voluntary)"
    common_pitfalls:
      - "Blue light hazard assessment (EN 62471) often overlooked"
      - "Flicker requirements tightening – check IEC/TR 61547-1"
      - "Ecodesign requirements (EU 2019/2020) set minimum efficiency"
    typical_test_costs:
      eu: "€3,000–8,000"
      us: "€2,000–6,000"

  power_supply:
    description: "AC/DC adapters, power supplies, chargers"
    eu_directives: ["2014/35/EU", "2014/30/EU", "2011/65/EU", "2012/19/EU", "EC 1907/2006", "94/62/EC"]
    en_standards:
      - "EN 62368-1 (Safety)"
      - "EN 61558-1 (Transformers)"
      - "EN 55032 (EMC emissions)"
      - "EN 61000-3-2 (Harmonics)"
    us_regulations:
      - "FCC Part 15"
      - "UL 62368-1 (safety)"
      - "DoE Level VI efficiency (mandatory)"
    common_pitfalls:
      - "Efficiency standards (ErP/DoE) are mandatory – minimum efficiency levels"
      - "Creepage and clearance distances critical for safety"
      - "No-load power consumption limits"
    typical_test_costs:
      eu: "€3,000–7,000"
      us: "€2,000–6,000"

  wearable:
    description: "Wearable electronics (smartwatches, fitness trackers, smart rings)"
    eu_directives: ["2014/53/EU", "2011/65/EU", "2012/19/EU", "EC 1907/2006", "2023/1542", "94/62/EC"]
    en_standards:
      - "EN 62368-1 (Safety)"
      - "EN 62133-2 (Battery safety)"
      - "EN 300 328 (BLE/WiFi)"
      - "EN 62209-2 (SAR – specific absorption rate)"
      - "EN ISO 10993-5 (Biocompatibility for skin contact)"
    us_regulations:
      - "FCC Part 15 (FCC ID for radio)"
      - "FCC SAR testing (if worn on body)"
    common_pitfalls:
      - "SAR testing required for devices worn on the body"
      - "Skin contact materials need biocompatibility assessment"
      - "Battery removability requirements (EU Battery Reg 2027)"
      - "Water resistance claims need IP rating testing"
    typical_test_costs:
      eu: "€8,000–20,000 (RED + SAR + battery + biocompat)"
      us: "€5,000–15,000 (FCC + SAR + UL)"

  toy:
    description: "Products designed for play by children under 14"
    eu_directives: ["2009/48/EC", "2011/65/EU", "2012/19/EU", "EC 1907/2006", "94/62/EC"]
    en_standards:
      - "EN 71-1 (Mechanical and physical properties)"
      - "EN 71-2 (Flammability)"
      - "EN 71-3 (Migration of elements)"
      - "EN 62115 (Safety of electric toys)"
    us_regulations:
      - "CPSIA (Consumer Product Safety Improvement Act)"
      - "ASTM F963 (Standard Consumer Safety Specification for Toy Safety)"
      - "16 CFR 1501 (Small parts)"
    common_pitfalls:
      - "Small parts testing mandatory for children under 3"
      - "Chemical testing is expensive and must cover many substances"
      - "Notified Body assessment required for chemical and electrical safety in EU"
      - "CPSIA requires third-party testing and Children's Product Certificate"
    typical_test_costs:
      eu: "€5,000–15,000 (full EN 71 suite + electrical)"
      us: "€3,000–10,000 (ASTM F963 + CPSIA)"

  medical_device_class_I:
    description: "Low-risk medical devices (Class I)"
    eu_directives: []
    note: "Medical Device Regulation (MDR) replaces most other directives for medical devices. This is a complex regulatory area – consider professional regulatory affairs support."
    en_standards:
      - "EN ISO 13485 (Quality management systems)"
      - "EN ISO 14971 (Risk management)"
      - "IEC 60601-1 (Medical electrical equipment – if electrical)"
      - "IEC 62304 (Software lifecycle – if contains software)"
    us_regulations:
      - "FDA 510(k) or De Novo (depending on classification)"
      - "21 CFR 820 (Quality System Regulation)"
    common_pitfalls:
      - "MDR is significantly stricter than the old MDD – transition is ongoing"
      - "Even Class I devices need technical documentation and EU DoC"
      - "UDI (Unique Device Identification) now required in EUDAMED"
      - "Software as Medical Device (SaMD) has its own classification rules"
    typical_test_costs:
      eu: "€10,000–50,000+ (depending on classification)"
      us: "€5,000–50,000+ (510(k) or De Novo)"

  furniture:
    description: "Consumer furniture (chairs, tables, shelving, beds)"
    eu_directives: ["2001/95/EC", "EC 1907/2006", "94/62/EC"]
    en_standards:
      - "EN 12520 (Seating)"
      - "EN 12521 (Tables)"
      - "EN 716 (Cots and cribs)"
      - "EN 747 (Bunk beds)"
      - "EN 14749 (Storage furniture)"
    us_regulations:
      - "CPSC tip-over standards (ASTM F2057 for dressers)"
      - "16 CFR 1261 (Clothing storage units – tip-over)"
    common_pitfalls:
      - "Tip-over risk is the #1 cause of furniture recalls"
      - "REACH applies to finishes, adhesives, and foam"
      - "No CE marking required for non-electrical furniture, but GPSD applies"
    typical_test_costs:
      eu: "€1,000–3,000 (stability + REACH)"
      us: "€1,000–3,000 (ASTM + tip-over)"

  textile:
    description: "Clothing, fabric products, soft furnishings"
    eu_directives: ["EC 1907/2006", "2001/95/EC", "94/62/EC"]
    en_standards:
      - "EN ISO 12952 (Flammability of bedding)"
      - "EN 14878 (Flammability of children's nightwear)"
      - "OEKO-TEX Standard 100 (voluntary but widely expected)"
    us_regulations:
      - "16 CFR 1610 (Flammability of clothing textiles)"
      - "16 CFR 1615/1616 (Children's sleepwear flammability)"
      - "CPSIA (if for children – lead/phthalate limits)"
    common_pitfalls:
      - "Flammability testing required for most textiles"
      - "AZO dyes restricted under REACH Annex XVII"
      - "CPSIA applies to all children's textile products"
    typical_test_costs:
      eu: "€500–2,000 (chemical + flammability)"
      us: "€500–2,000 (flammability + CPSIA)"

  packaging:
    description: "Product packaging (standalone, not as part of another product)"
    eu_directives: ["94/62/EC", "EC 1907/2006"]
    en_standards:
      - "EN 13427 (Use of packaging standards)"
      - "EN 13428 (Source reduction)"
      - "EN 13429 (Reuse)"
      - "EN 13430 (Material recycling)"
    us_regulations:
      - "State-level packaging laws (varies)"
      - "TPCH (Toxics in Packaging Clearinghouse)"
    common_pitfalls:
      - "Extended Producer Responsibility (EPR) registration required in most EU states"
      - "Heavy metal limits in packaging materials"
      - "France, Germany, Italy have strict packaging registration requirements"
    typical_test_costs:
      eu: "€500–1,500 (heavy metal testing + registration fees)"
      us: "€200–500 (TPCH testing)"
